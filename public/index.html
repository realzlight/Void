<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>Void</title>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<style>
  /* ── Reset & Base ───────────────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #000000;
    --surface:   #0a0a0a;
    --border:    #1a1a1a;
    --border2:   #262626;
    --muted:     #404040;
    --subtle:    #737373;
    --text:      #e5e5e5;
    --white:     #fafafa;
    --accent:    #ffffff;
    --danger:    #ef4444;
    --radius:    6px;
    --font:      'SF Mono', 'Fira Code', 'Cascadia Code', ui-monospace, monospace;
    --sans:      -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }

  /* ── Layout ─────────────────────────────────────────────────────────── */
  #app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 640px;
    margin: 0 auto;
    position: relative;
  }

  /* ── Header ─────────────────────────────────────────────────────────── */
  #header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    background: var(--bg);
    z-index: 10;
  }

  #logo {
    font-family: var(--font);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.15em;
    color: var(--white);
    text-transform: uppercase;
  }

  #logo span {
    display: inline-block;
    width: 7px;
    height: 7px;
    background: var(--white);
    border-radius: 50%;
    margin-right: 8px;
    vertical-align: middle;
    animation: pulse 2.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.3; transform: scale(0.7); }
  }

  #online-badge {
    font-family: var(--font);
    font-size: 11px;
    color: var(--subtle);
    letter-spacing: 0.05em;
  }

  #online-badge b {
    color: var(--text);
    font-weight: 500;
  }

  /* ── Status bar ──────────────────────────────────────────────────────── */
  #status-bar {
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    font-size: 12px;
    color: var(--subtle);
    font-family: var(--font);
    letter-spacing: 0.04em;
    min-height: 37px;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: color 0.2s;
  }

  #status-bar.connected { color: var(--text); }
  #status-bar.waiting   { color: var(--subtle); }

  #status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
    transition: background 0.3s;
  }

  #status-dot.connected { background: #22c55e; }
  #status-dot.waiting   { background: #eab308; animation: blink 1s step-end infinite; }
  #status-dot.idle      { background: var(--muted); animation: none; }

  @keyframes blink { 50% { opacity: 0; } }

  /* ── Chat area ───────────────────────────────────────────────────────── */
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }

  #chat::-webkit-scrollbar { width: 4px; }
  #chat::-webkit-scrollbar-track { background: transparent; }
  #chat::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  /* ── Messages ────────────────────────────────────────────────────────── */
  .msg {
    max-width: 82%;
    padding: 9px 13px;
    border-radius: var(--radius);
    font-size: 14px;
    line-height: 1.55;
    word-break: break-word;
    animation: fadeUp 0.15s ease-out;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg.you {
    align-self: flex-end;
    background: var(--white);
    color: #000;
    border-bottom-right-radius: 2px;
  }

  .msg.stranger {
    align-self: flex-start;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border2);
    border-bottom-left-radius: 2px;
  }

  .msg.system {
    align-self: center;
    background: transparent;
    color: var(--muted);
    font-size: 11px;
    font-family: var(--font);
    letter-spacing: 0.06em;
    padding: 4px 0;
    text-transform: uppercase;
    border: none;
    max-width: 100%;
  }

  /* ── Typing indicator ────────────────────────────────────────────────── */
  #typing-indicator {
    padding: 0 16px 6px;
    font-size: 11px;
    font-family: var(--font);
    color: var(--muted);
    letter-spacing: 0.04em;
    height: 22px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    opacity: 0;
    transition: opacity 0.2s;
  }

  #typing-indicator.visible { opacity: 1; }

  .typing-dots {
    display: flex;
    gap: 3px;
    align-items: center;
  }

  .typing-dots span {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--muted);
    animation: dot-bounce 1.2s ease-in-out infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes dot-bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-4px); }
  }

  /* ── Input area ──────────────────────────────────────────────────────── */
  #input-area {
    flex-shrink: 0;
    border-top: 1px solid var(--border);
    padding: 12px 16px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    background: var(--bg);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  #input-row {
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }

  #msg-input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    color: var(--text);
    font-size: 14px;
    font-family: var(--sans);
    padding: 10px 13px;
    resize: none;
    min-height: 42px;
    max-height: 120px;
    outline: none;
    transition: border-color 0.15s;
    line-height: 1.5;
    -webkit-appearance: none;
  }

  #msg-input::placeholder { color: var(--muted); }
  #msg-input:focus { border-color: var(--border2); box-shadow: 0 0 0 1px var(--border2); }

  #send-btn {
    width: 42px;
    height: 42px;
    background: var(--white);
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: opacity 0.15s, transform 0.1s;
    color: #000;
  }

  #send-btn:active { transform: scale(0.94); opacity: 0.8; }
  #send-btn:disabled { opacity: 0.25; cursor: default; }

  /* ── Action buttons ──────────────────────────────────────────────────── */
  #actions {
    display: flex;
    gap: 8px;
  }

  .btn {
    flex: 1;
    padding: 9px 0;
    border-radius: var(--radius);
    font-size: 12px;
    font-family: var(--font);
    font-weight: 500;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    cursor: pointer;
    border: 1px solid var(--border2);
    background: transparent;
    color: var(--text);
    transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.1s;
    outline: none;
    -webkit-tap-highlight-color: transparent;
  }

  .btn:active { transform: scale(0.97); }

  .btn.primary {
    background: var(--white);
    color: #000;
    border-color: var(--white);
  }

  .btn.danger {
    color: var(--danger);
    border-color: #2d1212;
  }

  .btn:disabled {
    opacity: 0.3;
    cursor: default;
    transform: none;
  }

  /* ── Empty state ─────────────────────────────────────────────────────── */
  #empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--muted);
    font-size: 13px;
    font-family: var(--font);
    letter-spacing: 0.06em;
    text-align: center;
    padding: 32px;
    user-select: none;
  }

  #empty-state .big {
    font-size: 36px;
    opacity: 0.15;
    letter-spacing: 0.2em;
    font-weight: 700;
    color: var(--white);
  }

  #empty-state p {
    text-transform: uppercase;
    font-size: 11px;
  }
</style>
</head>
<body>
<div id="app">

  <!-- Header -->
  <div id="header">
    <div id="logo"><span></span>Void</div>
    <div id="online-badge"><b id="online-count">0</b> online</div>
  </div>

  <!-- Status bar -->
  <div id="status-bar">
    <div id="status-dot" class="idle"></div>
    <span id="status-text">not connected</span>
  </div>

  <!-- Chat or Empty State -->
  <div id="chat-container" style="display:flex;flex-direction:column;flex:1;overflow:hidden;">
    <div id="empty-state">
      <div class="big">VOID</div>
      <p>anonymous · ephemeral · real</p>
      <p style="margin-top:4px;color:var(--muted);font-size:10px;">tap new to find a stranger</p>
    </div>
    <div id="chat" style="display:none;"></div>
  </div>

  <!-- Typing indicator -->
  <div id="typing-indicator">
    <div class="typing-dots"><span></span><span></span><span></span></div>
    stranger is typing
  </div>

  <!-- Input -->
  <div id="input-area">
    <div id="input-row">
      <textarea
        id="msg-input"
        placeholder="message"
        rows="1"
        maxlength="2000"
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
        disabled
      ></textarea>
      <button id="send-btn" disabled title="Send">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M2 8L14 2L9 14L7.5 9L2 8Z" fill="currentColor"/>
        </svg>
      </button>
    </div>
    <div id="actions">
      <button class="btn primary" id="btn-new">New</button>
      <button class="btn" id="btn-skip" disabled>Skip</button>
      <button class="btn danger" id="btn-leave" disabled>Leave</button>
    </div>
  </div>

</div>
<script src="https://unpkg.com/socket.io-client@4.7.2/dist/socket.io.min.js"></script>
<script>
(function () {
  // ── State ────────────────────────────────────────────────────────────────
  const STATE = {
    IDLE:      "idle",
    WAITING:   "waiting",
    CHATTING:  "chatting",
  };

  let state        = STATE.IDLE;
  let typingTimer  = null;
  let isTyping     = false;
  let strangerTypingTimer = null;

  // ── DOM refs ──────────────────────────────────────────────────────────────
  const $chat        = document.getElementById("chat");
  const $empty       = document.getElementById("empty-state");
  const $statusBar   = document.getElementById("status-bar");
  const $statusDot   = document.getElementById("status-dot");
  const $statusText  = document.getElementById("status-text");
  const $onlineCount = document.getElementById("online-count");
  const $msgInput    = document.getElementById("msg-input");
  const $sendBtn     = document.getElementById("send-btn");
  const $btnNew      = document.getElementById("btn-new");
  const $btnSkip     = document.getElementById("btn-skip");
  const $btnLeave    = document.getElementById("btn-leave");
  const $typing      = document.getElementById("typing-indicator");

  // ── Socket.io ─────────────────────────────────────────────────────────────
  const socket = io({ transports: ["websocket", "polling"] });

  socket.on("connect", () => {
    setStatus(STATE.IDLE, "not connected");
  });

  socket.on("disconnect", () => {
    setStatus(STATE.IDLE, "disconnected");
    disableChat();
    postSystem("— connection lost —");
  });

  socket.on("online_count", ({ count }) => {
    $onlineCount.textContent = count;
  });

  socket.on("waiting", () => {
    setStatus(STATE.WAITING, "searching for stranger...");
    postSystem("— searching —");
  });

  socket.on("matched", () => {
    setStatus(STATE.CHATTING, "connected to stranger");
    enableChat();
    postSystem("— connected —");
    $btnSkip.disabled = false;
    $btnLeave.disabled = false;
    $btnNew.textContent = "New";
  });

  socket.on("message", ({ text }) => {
    postMessage("stranger", text);
  });

  socket.on("typing", ({ typing }) => {
    if (typing) {
      $typing.classList.add("visible");
      clearTimeout(strangerTypingTimer);
      strangerTypingTimer = setTimeout(() => {
        $typing.classList.remove("visible");
      }, 3000);
    } else {
      clearTimeout(strangerTypingTimer);
      $typing.classList.remove("visible");
    }
  });

  socket.on("stranger_left", () => {
    setStatus(STATE.IDLE, "stranger disconnected");
    disableChat();
    postSystem("— stranger has left —");
    $typing.classList.remove("visible");
  });

  socket.on("left", () => {
    setStatus(STATE.IDLE, "not connected");
    disableChat();
  });

  // ── Buttons ───────────────────────────────────────────────────────────────
  $btnNew.addEventListener("click", () => {
    clearChat();
    socket.emit("find");
    $btnNew.textContent = "New";
    $btnSkip.disabled = true;
    $btnLeave.disabled = true;
    disableChat();
  });

  $btnSkip.addEventListener("click", () => {
    if (state !== STATE.CHATTING) return;
    socket.emit("leave");
    clearChat();
    $typing.classList.remove("visible");
    disableChat();
    // Auto find next
    setTimeout(() => {
      socket.emit("find");
    }, 100);
  });

  $btnLeave.addEventListener("click", () => {
    socket.emit("leave");
    clearChat();
    $typing.classList.remove("visible");
    disableChat();
    setStatus(STATE.IDLE, "not connected");
  });

  // ── Input ─────────────────────────────────────────────────────────────────
  $msgInput.addEventListener("input", () => {
    autoResize($msgInput);

    if (!isTyping) {
      isTyping = true;
      socket.emit("typing", { typing: true });
    }
    clearTimeout(typingTimer);
    typingTimer = setTimeout(() => {
      isTyping = false;
      socket.emit("typing", { typing: false });
    }, 1500);
  });

  $msgInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  $sendBtn.addEventListener("click", sendMessage);

  function sendMessage() {
    const text = $msgInput.value.trim();
    if (!text || state !== STATE.CHATTING) return;

    socket.emit("message", { text });
    postMessage("you", text);
    $msgInput.value = "";
    autoResize($msgInput);

    clearTimeout(typingTimer);
    isTyping = false;
    socket.emit("typing", { typing: false });
  }

  // ── Helpers ───────────────────────────────────────────────────────────────
  function setStatus(newState, text) {
    state = newState;
    $statusText.textContent = text;
    $statusDot.className = "";
    $statusBar.className = "";

    if (newState === STATE.CHATTING) {
      $statusDot.classList.add("connected");
      $statusBar.classList.add("connected");
    } else if (newState === STATE.WAITING) {
      $statusDot.classList.add("waiting");
      $statusBar.classList.add("waiting");
    } else {
      $statusDot.classList.add("idle");
    }
  }

  function enableChat() {
    $msgInput.disabled = false;
    $sendBtn.disabled = false;
    $msgInput.focus();
  }

  function disableChat() {
    $msgInput.disabled = true;
    $sendBtn.disabled = true;
    $btnSkip.disabled = true;
    $btnLeave.disabled = true;
  }

  function clearChat() {
    $chat.innerHTML = "";
    showChat(false);
  }

  function showChat(show) {
    if (show) {
      $empty.style.display = "none";
      $chat.style.display = "flex";
    } else {
      $empty.style.display = "flex";
      $chat.style.display = "none";
    }
  }

  function postMessage(from, text) {
    showChat(true);
    const el = document.createElement("div");
    el.className = "msg " + from;
    el.textContent = text;
    $chat.appendChild(el);
    scrollToBottom();
  }

  function postSystem(text) {
    showChat(true);
    const el = document.createElement("div");
    el.className = "msg system";
    el.textContent = text;
    $chat.appendChild(el);
    scrollToBottom();
  }

  function scrollToBottom() {
    requestAnimationFrame(() => {
      $chat.scrollTop = $chat.scrollHeight;
    });
  }

  function autoResize(el) {
    el.style.height = "auto";
    el.style.height = Math.min(el.scrollHeight, 120) + "px";
  }

  // ── iOS keyboard fix: scroll to input on focus ─────────────────────────
  $msgInput.addEventListener("focus", () => {
    setTimeout(scrollToBottom, 300);
  });

})();
</script>
</body>
</html>
