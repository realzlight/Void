<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Void — Real Chat</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">

<script src="/socket.io/socket.io.js"></script>

<style>
:root {
  --bg:#050505;
  --surface:#111;
  --border:#222;
  --accent:#e8ff47;
  --text:#eee;
  --muted:#666;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Space Grotesk',sans-serif;
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* layout */
.screen{display:none;height:100%}
.screen.active{display:flex}

/* landing */
#landing{
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:20px;
}

button{
  padding:14px 20px;
  border-radius:12px;
  border:none;
  cursor:pointer;
  font-weight:600;
}

.primary{
  background:var(--accent);
  color:#000;
}

/* chat */
#chat{
  flex-direction:column;
}

.header{
  padding:12px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
}

.messages{
  flex:1;
  overflow:auto;
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.msg{
  max-width:70%;
  padding:10px;
  border-radius:12px;
}

.you{background:var(--accent);color:#000;align-self:flex-end}
.stranger{background:var(--surface)}

.input{
  display:flex;
  border-top:1px solid var(--border);
}

input{
  flex:1;
  padding:12px;
  background:none;
  border:none;
  color:white;
}

.send{
  background:var(--accent);
  border:none;
  padding:12px;
}
</style>
</head>

<body>

<!-- LANDING -->
<div id="landing" class="screen active">
  <h1>Void</h1>
  <button class="primary" onclick="start()">Start Chat</button>
</div>

<!-- CHAT -->
<div id="chat" class="screen">
  <div class="header">
    <div id="status">Connecting...</div>
    <button onclick="next()">Next</button>
  </div>

  <div id="messages" class="messages"></div>

  <div class="input">
    <input id="msg" placeholder="Type..." />
    <button class="send" onclick="send()">Send</button>
  </div>
</div>

<script>
const socket = io();
let connected = false;

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function start(){
  show('chat');
  socket.emit('find');
  document.getElementById('status').innerText="Finding...";
}

function next(){
  socket.emit('next');
  document.getElementById('status').innerText="Finding new...";
  document.getElementById('messages').innerHTML="";
}

function send(){
  const input=document.getElementById('msg');
  if(!input.value || !connected) return;

  addMsg("you",input.value);
  socket.emit('message',input.value);
  input.value="";
}

function addMsg(type,text){
  const div=document.createElement('div');
  div.className="msg "+type;
  div.innerText=text;
  document.getElementById('messages').appendChild(div);
}

/* socket events */

socket.on('connected',()=>{
  connected=true;
  document.getElementById('status').innerText="Connected";
});

socket.on('message',(msg)=>{
  addMsg("stranger",msg);
});

socket.on('disconnected',()=>{
  connected=false;
  document.getElementById('status').innerText="Disconnected";
});

socket.on('finding',()=>{
  connected=false;
  document.getElementById('status').innerText="Finding...";
});
</script>

</body>
</html>
